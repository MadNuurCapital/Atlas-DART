[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The Next.js Runtime v5 is auto-detected by Netlify. Do not add a legacy
# @netlify/plugin-nextjs pin or the deprecated next-on-netlify adapter here.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled functions declare their own cron via `export const config` in the
# function file itself (netlify/functions/*.mts). Both crons are UTC.
#   reminder-consultants   0 13 * * *   -> 21:00 Asia/Singapore
#   reminder-admin-digest 59 15 * * *   -> 23:59 Asia/Singapore

[dev]
  framework = "next"
  targetPort = 3000
