# =============================================================================
# Drive the reminders from GitHub Actions.
#
# WHY THIS EXISTS
# The reminder functions used to declare their own crons via
# `export const config = { schedule }` and Netlify was supposed to invoke them.
# On this site it never did - reminder_logs was empty from launch, not one
# attempt. Worse, that declaration is what REMOVES a function's public HTTP
# endpoint, so it also blocked every other way of running them. The blocks are
# gone; the schedule lives here, and in pg_cron as a punctual second driver.
#
# Running both is safe: every send is written to reminder_logs under a unique
# key, and an already-sent reminder is skipped. Whichever driver arrives first
# does the work and the other finds it done.
#
# SETUP (one secret, once)
#   Settings > Secrets and variables > Actions > New repository secret
#     REMINDER_TEST_TOKEN   the same value as in Netlify's env vars
#
#   APP_URL is optional. It falls back to the production site below, because a
#   site address is not a secret and making someone paste two things to fix one
#   problem is how a fix goes unapplied. Set the secret only to point the
#   workflow somewhere else - a custom domain, or a staging site.
#
# TWO THINGS TO KNOW ABOUT GITHUB'S SCHEDULER
#   1. It is best-effort, and routinely 15-40 minutes late. Every slot here
#      tolerates that except the 23:59 final call, which would land after
#      midnight and refuse to send - pg_cron is what makes that one land on
#      time, and GitHub's late copy of it finds the work already done.
#   2. GitHub disables scheduled workflows in a repository that has had no
#      commits for 60 days, and emails the owner when it does. If reminders go
#      quiet after a long stretch of nobody touching the repo, look here first:
#      Actions > Reminders > "Enable workflow".
#
# All crons are UTC. Singapore is UTC+8.
# =============================================================================

name: Reminders

on:
  schedule:
    # 19:00 Singapore. The chase opens: "closes at 11:59, takes two minutes".
    - cron: "0 11 * * *"
    # 21:00 Singapore. Chase + the email nudge, which has always run here.
    - cron: "0 13 * * *"
    # 23:00 Singapore. Last call.
    - cron: "0 15 * * *"
    # 23:59 Singapore. The final call, one minute before the deadline.
    - cron: "59 15 * * *"
    # 06:00 Singapore. The silent overdue nudge + the admin digest, in that
    # order: the last chance to fix yesterday before an admin sees the list.
    - cron: "0 22 * * *"
    # 08:00 and 19:00 Singapore. Coaching.
    - cron: "0 0,11 * * *"

  # So it can be fired by hand from the Actions tab, without a URL or a token.
  workflow_dispatch:
    inputs:
      which:
        description: "Which reminder to send"
        required: true
        default: push-reminders
        type: choice
        options:
          - push-reminders
          - coaching-reminders
          - reminder-consultants
          - reminder-admin-digest
      dryRun:
        description: "Report what would be sent, without sending it"
        required: false
        default: true
        type: boolean

# One at a time. Two overlapping runs would each read "not yet sent" before
# either had written its log row, which is the one way to buzz a phone twice.
concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Work out what this run should call
        id: plan
        env:
          FIRED: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.which }}
          DRY: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail
          extra=""
          if [ -n "${MANUAL:-}" ]; then
            targets="${MANUAL}"
            dry="${DRY:-false}"
          else
            # Several crons can share a firing minute, so this maps the exact
            # cron string GitHub reports back to the function(s) it belongs to.
            # A slot can name more than one function; they are called in order.
            case "${FIRED}" in
              "0 11 * * *")   targets="push-reminders" ;;
              "0 13 * * *")   targets="push-reminders reminder-consultants" ;;
              "0 15 * * *")   targets="push-reminders" ;;
              # 23:00 and 23:59 are both hour 23, and the log key the function
              # writes is built from the hour. Without a name of its own the
              # final call keys on push_23, finds the 11 PM row already there,
              # and is skipped as a duplicate of the thing it follows.
              "59 15 * * *")  targets="push-reminders"; extra="slot=deadline" ;;
              "0 22 * * *")   targets="push-reminders reminder-admin-digest" ;;
              "0 0,11 * * *") targets="coaching-reminders" ;;
              *)              targets="" ;;
            esac
            dry="false"
          fi
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "dry=${dry}"         >> "$GITHUB_OUTPUT"
          echo "extra=${extra}"     >> "$GITHUB_OUTPUT"

      - name: Call the reminder function
        if: steps.plan.outputs.targets != ''
        env:
          # The site address is public, so it is a default rather than a
          # required secret; the secret only overrides it.
          APP_URL: ${{ secrets.APP_URL || 'https://atlasdartibw.netlify.app' }}
          TOKEN: ${{ secrets.REMINDER_TEST_TOKEN }}
          TARGETS: ${{ steps.plan.outputs.targets }}
          DRY: ${{ steps.plan.outputs.dry }}
          EXTRA: ${{ steps.plan.outputs.extra }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::REMINDER_TEST_TOKEN is not set. Add it under Settings > Secrets and variables > Actions, using the same value as the REMINDER_TEST_TOKEN env var in Netlify. Until then every run fails here and no reminder is sent."
            exit 1
          fi

          base="${APP_URL%/}"
          failed=0

          for fn in $TARGETS; do
            query=""
            if [ "$DRY" = "true" ]; then
              query="dryRun=true"
            fi
            # Only push-reminders takes a slot. The other functions would
            # ignore it, but a parameter aimed at one function should not be
            # sent to another just because they share a firing minute.
            if [ -n "${EXTRA:-}" ] && [ "$fn" = "push-reminders" ]; then
              query="${query:+${query}&}${EXTRA}"
            fi

            url="${base}/.netlify/functions/${fn}${query:+?${query}}"

            echo "::group::${fn}${query:+ (${query})}"
            # The token goes in a header, never the URL - a query string ends up
            # in logs and in Netlify's request records.
            #
            # `|| true` rather than `|| echo 000`: curl already prints 000 to
            # stdout via -w when the request never completes, so an echo on top
            # of it produced the memorable code "000000" and the run reported a
            # transport failure as an HTTP status.
            code=$(curl -sS -o response.json -w '%{http_code}' \
                     --max-time 120 \
                     -H "Authorization: Bearer ${TOKEN}" \
                     "$url" || true)

            echo "HTTP ${code}"
            cat response.json 2>/dev/null || true
            echo
            echo "::endgroup::"

            case "$code" in
              200) ;;
              3*)
                # curl deliberately does not follow redirects here. A 3xx means
                # something sits in front of the function and answered instead
                # of it - which is exactly what happened once: the Next.js
                # middleware matched /.netlify/* , found no session cookie on a
                # scheduler's request, and bounced it to /login with a 307.
                # Following the redirect would have returned 200 for the login
                # page and reported a healthy run that sent nothing at all.
                echo "::error::${fn} returned HTTP ${code} - a redirect. Something is answering in front of the function; check the middleware matcher in middleware.ts excludes .netlify"
                failed=1
                ;;
              401)
                echo "::error::${fn} returned HTTP 401. The REMINDER_TEST_TOKEN secret here does not match the REMINDER_TEST_TOKEN env var in Netlify, or Netlify has not redeployed since it changed."
                failed=1
                ;;
              403)
                # An empty 403 answered in milliseconds is Netlify's edge, not
                # the function - the function's own refusal is a 401 with a
                # body. This is what a Netlify Scheduled Function looks like
                # from outside: declaring `export const config = { schedule }`
                # removes the public HTTP endpoint entirely.
                echo "::error::${fn} returned HTTP 403 from Netlify's edge, so the function was never reached. Check that netlify/functions/${fn}.mts does NOT declare 'export const config = { schedule }' - a scheduled function has no public HTTP endpoint in production."
                failed=1
                ;;
              *)
                echo "::error::${fn} returned HTTP ${code}"
                failed=1
                ;;
            esac
          done

          exit $failed
